name: primeview
description: "Open-source media hub — IPTV, YouTube, local video player. No accounts, just watch."
publish_to: 'none'
version: 0.1.0+1
license: GPL-3.0-or-later

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  get_it: ^8.0.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  cached_network_image: ^3.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  equatable: ^2.0.7
  logger: ^2.5.0
  wakelock_plus: ^1.2.10
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  html_unescape: ^2.0.0
  flutter_screenutil: ^5.9.3
  youtube_explode_dart: ^2.3.5
  permission_handler: ^11.0.0
  photo_manager: ^3.0.0
  file_picker: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
